name: Android APK

on:
  push:
    branches: [claude/gps-speed-tracking-app-813i5r, main]
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gps-speedometer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gps-speedometer-apk
          path: gps-speedometer.apk

      # Fixed tag, so the phone download link never changes.
      - name: Publish release "latest-apk"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk gps-speedometer.apk \
            --target "${{ github.sha }}" \
            --title "GPS Speedometer (build ${{ github.run_number }})" \
            --notes "Debug APK built from ${{ github.sha }} on branch ${{ github.ref_name }}."
